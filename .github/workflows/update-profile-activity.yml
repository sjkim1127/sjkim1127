name: Update profile activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update recent commits section
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const username = "sjkim1127";
            const readmePath = "README.md";
            const startMarker = "<!-- RECENT-COMMITS:START -->";
            const endMarker = "<!-- RECENT-COMMITS:END -->";

            const escapeMarkdown = (value) =>
              String(value || "")
                .split("\n")[0]
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\|/g, "\\|")
                .trim();

            const formatKst = (iso) => {
              const parts = new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
              }).formatToParts(new Date(iso));

              const byType = Object.fromEntries(parts.map((p) => [p.type, p.value]));
              return `${byType.year}-${byType.month}-${byType.day} ${byType.hour}:${byType.minute} KST`;
            };

            const { data: searchResult } = await github.rest.search.commits({
              q: `author:${username} -repo:${owner}/${repo}`,
              sort: "committer-date",
              order: "desc",
              per_page: 8,
              headers: {
                accept: "application/vnd.github+json",
              },
            });

            const rows = (searchResult.items || []).map((commit) => {
              const shortSha = commit.sha.slice(0, 7);
              const repoName = commit.repository.full_name;
              const message = escapeMarkdown(commit.commit.message);
              const date = formatKst(commit.commit.committer.date);
              return `| ${date} | [${repoName}](${commit.repository.html_url}) | [${shortSha}](${commit.html_url}) | ${message} |`;
            });

            const generated = [
              startMarker,
              "| Time | Repository | Commit | Message |",
              "|---|---|---|---|",
              ...(rows.length ? rows : ["| - | - | - | No recent commits found. |"]),
              "",
              `<!-- Last updated: ${formatKst(new Date().toISOString())} -->`,
              endMarker,
            ].join("\n");

            const { data: readme } = await github.rest.repos.getContent({
              owner,
              repo,
              path: readmePath,
            });

            const current = Buffer.from(readme.content, readme.encoding).toString("utf8");
            const pattern = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`);

            if (!pattern.test(current)) {
              core.setFailed("README markers were not found.");
              return;
            }

            const next = current.replace(pattern, generated);

            if (next === current) {
              core.info("README is already up to date.");
              return;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: readmePath,
              message: "chore: update recent commits in profile",
              content: Buffer.from(next).toString("base64"),
              sha: readme.sha,
            });
