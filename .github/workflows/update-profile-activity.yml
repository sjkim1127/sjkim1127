name: Update profile activity image

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Generate recent activity SVG
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const username = "sjkim1127";
            const path = "assets/github-activity.svg";

            const escapeXml = (value) =>
              String(value || "")
                .split("\n")[0]
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&apos;")
                .trim();

            const truncate = (value, max) => {
              const safe = escapeXml(value);
              return safe.length > max ? `${safe.slice(0, max - 1)}…` : safe;
            };

            const formatKst = (iso) => {
              const parts = new Intl.DateTimeFormat("en-CA", {
                timeZone: "Asia/Seoul",
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                hour12: false,
              }).formatToParts(new Date(iso));
              const byType = Object.fromEntries(parts.map((p) => [p.type, p.value]));
              return `${byType.year}-${byType.month}-${byType.day} ${byType.hour}:${byType.minute}`;
            };

            const { data: searchResult } = await github.rest.search.commits({
              q: `author:${username} -repo:${owner}/${repo}`,
              sort: "committer-date",
              order: "desc",
              per_page: 7,
              headers: { accept: "application/vnd.github+json" },
            });

            const commits = searchResult.items || [];
            const activeRepos = new Set(commits.map((item) => item.repository.full_name));
            const mainRepo = commits[0]?.repository?.name || "activity";
            const updated = `${formatKst(new Date().toISOString())} KST`;
            const colors = ["#58A6FF", "#F97316", "#A855F7", "#22C55E"];

            const rows = commits.map((item, idx) => {
              const y = 292 + idx * 34;
              const color = colors[idx % colors.length];
              const time = formatKst(item.commit.committer.date);
              const repoName = truncate(item.repository.full_name, 26);
              const sha = item.sha.slice(0, 7);
              const message = truncate(item.commit.message, 64);
              return `
                <g transform="translate(42 ${y})">
                  <circle cx="8" cy="8" r="5" fill="${color}"/>
                  <text x="24" y="13" fill="#C9D1D9">${time}</text>
                  <text x="166" y="13" fill="#F0F6FC" font-weight="700">${repoName}</text>
                  <text x="350" y="13" fill="#58A6FF" font-weight="700">${sha}</text>
                  <text x="460" y="13" fill="#C9D1D9">${message}</text>
                </g>`;
            }).join("\n");

            const svg = `<svg width="920" height="520" viewBox="0 0 920 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
              <title id="title">Recent GitHub Activity</title>
              <desc id="desc">Recent commit activity for ${username} rendered as a local SVG card.</desc>
              <defs>
                <linearGradient id="bg" x1="0" y1="0" x2="920" y2="520" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#0D1117"/><stop offset="0.55" stop-color="#111827"/><stop offset="1" stop-color="#1F2937"/>
                </linearGradient>
                <linearGradient id="accent" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#58A6FF"/><stop offset="0.45" stop-color="#F97316"/><stop offset="1" stop-color="#A855F7"/>
                </linearGradient>
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
                </filter>
              </defs>
              <rect width="920" height="520" rx="24" fill="url(#bg)"/>
              <rect x="1" y="1" width="918" height="518" rx="23" stroke="#30363D"/>
              <rect x="30" y="30" width="860" height="4" rx="2" fill="url(#accent)"/>

              <text x="42" y="78" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Recent GitHub Activity</text>
              <text x="42" y="106" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Latest public commits by @${username} · updated ${updated}</text>

              <g filter="url(#shadow)"><rect x="42" y="132" width="260" height="76" rx="16" fill="#161B22" stroke="#30363D"/><text x="64" y="162" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Recent commits shown</text><text x="64" y="190" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">${commits.length}</text></g>
              <g filter="url(#shadow)"><rect x="330" y="132" width="260" height="76" rx="16" fill="#161B22" stroke="#30363D"/><text x="352" y="162" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Active repositories</text><text x="352" y="190" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">${activeRepos.size}</text></g>
              <g filter="url(#shadow)"><rect x="618" y="132" width="260" height="76" rx="16" fill="#161B22" stroke="#30363D"/><text x="640" y="162" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Latest repository</text><text x="640" y="190" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">${escapeXml(mainRepo)}</text></g>

              <g transform="translate(42 240)"><rect width="836" height="40" rx="12" fill="#161B22" stroke="#30363D"/><text x="18" y="26" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">TIME</text><text x="166" y="26" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">REPOSITORY</text><text x="350" y="26" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">COMMIT</text><text x="460" y="26" fill="#8B949E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">MESSAGE</text></g>
              <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">${rows}</g>
            </svg>`;

            let sha;
            try {
              const { data: existing } = await github.rest.repos.getContent({ owner, repo, path });
              sha = existing.sha;
              const current = Buffer.from(existing.content, existing.encoding).toString("utf8");
              if (current === svg) {
                core.info("Activity SVG is already up to date.");
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: "chore: update profile activity image",
              content: Buffer.from(svg).toString("base64"),
              sha,
            });
