<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sung Joo Kim hero banner</title>
  <desc id="desc">A dark terminal-style GitHub profile banner for reverse engineering, binary analysis, systems tooling, and AI-assisted security workflows.</desc>
  <defs>
