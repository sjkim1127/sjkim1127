    <rect width="270" height="286" rx="20" fill="#161B22" stroke="#30363D"/>
    <rect width="270" height="106" rx="20" fill="url(#mcp)"/>
    <text x="22" y="48" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="900">Reversecore</text>
    <text x="22" y="76" fill="#A855F7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">MCP security server</text>
    <text x="22" y="136" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">AI-accessible reverse engineering</text>
    <text x="22" y="160" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">and security analysis system for</text>
    <text x="22" y="184" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">malware triage, SAST, forensics,</text>
    <text x="22" y="208" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">and reporting workflows.</text>
    <rect x="22" y="238" width="70" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
    <text x="39" y="256" fill="#58A6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">MCP</text>
    <rect x="102" y="238" width="76" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
    <text x="117" y="256" fill="#A855F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Python</text>
    <rect x="188" y="238" width="58" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
    <text x="204" y="256" fill="#22C55E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">RE</text>
  </g>

  <g transform="translate(648 124)" filter="url(#shadow)">
    <rect width="270" height="286" rx="20" fill="#161B22" stroke="#30363D"/>
    <rect width="270" height="106" rx="20" fill="url(#bench)"/>
    <text x="22" y="48" fill="#F0F6FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="900">Benchmarks</text>
    <text x="22" y="76" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">evaluation support</text>
    <text x="22" y="136" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Quality and evaluation support</text>
    <text x="22" y="160" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">around decompiler behavior,</text>
    <text x="22" y="184" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">regression checks, and practical</text>
    <text x="22" y="208" fill="#C9D1D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">analysis quality loops.</text>
    <rect x="22" y="238" width="58" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
    <text x="38" y="256" fill="#22C55E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">QA</text>
    <rect x="90" y="238" width="92" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
    <text x="105" y="256" fill="#58A6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Corpus</text>
    <rect x="192" y="238" width="58" height="26" rx="13" fill="#0D1117" stroke="#30363D"/>
    <text x="207" y="256" fill="#F97316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">CI</text>
